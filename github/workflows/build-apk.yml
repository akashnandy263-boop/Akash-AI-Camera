name: Build Akash AI Camera

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o Akash-AI-Camera-GitHub-Ready.zip -d project

      - name: Locate Android project
        run: |
          find project -name settings.gradle.kts -print

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: |
          PROJECT=$(dirname "$(find project -name settings.gradle.kts | head -1)")
          echo "Building: $PROJECT"
          gradle -p "$PROJECT" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Akash-AI-Camera-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
